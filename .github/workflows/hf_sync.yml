name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main1]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://lalit9031:${HF_TOKEN}@huggingface.co/spaces/lalit9031/kids-story-studio
          git push hf main1:main --force
