name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main1]

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Set up Git user config
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Create an orphaned deployment branch to exclude historical binaries
          git checkout --orphan deploy-hf
          git reset
          git add .
          git commit -m "deploy: automated clean build"
          
          # Push to Hugging Face Space main branch
          git push https://Lalit9031:${HF_TOKEN}@huggingface.co/spaces/Lalit9031/kids-story-studio deploy-hf:main --force
