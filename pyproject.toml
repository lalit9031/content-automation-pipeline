[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "content-automation-pipeline"
version = "0.1.0"
description = "Daily content pipeline starter: prompt, imagery, and controlled publishing."
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.42.0",
  "cairosvg>=2.7.1",
  "edge-tts>=6.1.12",
  "requests>=2.32.0",
  "anthropic>=0.52.0",
  "google-genai>=1.16.0",
  "openai>=1.82.0",
  "google-api-python-client>=2.170.0",
  "google-auth-oauthlib>=1.2.2",
  "streamlit>=1.37.0",
  "gradio-client>=1.3.0",
  "pydub>=0.25.1",
  "audioop-lts; python_version >= '3.13'",
  "scipy>=1.13.0",
]


[project.scripts]
content-pipeline = "content_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
